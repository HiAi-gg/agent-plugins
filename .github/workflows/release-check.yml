name: release-check

on:
  workflow_dispatch:
  schedule:
    # Weekly release-readiness check
    - cron: "17 3 * * 1"

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Version consistency
        run: |
          set -e
          for p in plugins/*/; do
            name=$(basename "$p")
            v=$(python3 -c "import json; print(json.load(open('plugins/$name/plugin.json'))['version'])")
            echo "$name: $v"
          done

      # Release reproducibility: byte-identical regeneration of plugin.json,
      # mcp.json (when present) and the FULL content of every skills/*/SKILL.md
      # from the pinned Builder 0.0.9.
      - name: Builder reproducibility
        run: |
          set -euo pipefail
          for plugin in github agent-browser context7 firecrawl redis sentry supabase figma cloudflare notion docker kubernetes postgresql; do
            # Remove any stale output so the step is safe to re-run
            # (builder 0.0.9 refuses to overwrite a non-empty directory)
            rm -rf "/tmp/regen-$plugin"
            npx @hiai-gg/agent-plugins-builder@0.0.9 create \
              --config "plugins/$plugin/plugin.yml" \
              --output "/tmp/regen-$plugin" || { echo "Regeneration failed for $plugin"; exit 1; }
            diff -u "plugins/$plugin/plugin.json" "/tmp/regen-$plugin/plugin.json" || exit 1
            if [ -f "/tmp/regen-$plugin/mcp.json" ]; then
              diff -u "plugins/$plugin/mcp.json" "/tmp/regen-$plugin/mcp.json" || exit 1
            fi
            for skill_md in /tmp/regen-$plugin/skills/*/SKILL.md; do
              skill_name=$(basename "$(dirname "$skill_md")")
              diff -u "plugins/$plugin/skills/$skill_name/SKILL.md" "$skill_md" || exit 1
            done
          done

      # Mandatory Doctor gate: the ecosystem's canonical validator must pass on
      # every plugin before a release is considered ready.
      - name: Doctor validation
        run: |
          fail=0
          for plugin in github agent-browser context7 firecrawl redis sentry supabase figma cloudflare notion docker kubernetes postgresql; do
            echo "Checking $plugin..."
            npx @hiai-gg/agent-plugins-doctor@0.0.6 check plugins/$plugin || fail=1
          done
          if [ $fail -ne 0 ]; then
            echo "Doctor validation failed"
            exit 1
          fi

      - name: PostgreSQL unit tests
        run: |
          cd plugins/postgresql/packages/postgres-mcp
          bun install --frozen-lockfile
          bun test
