name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Gate 1: the active collection is exactly the 13 approved plugins.
      # Catches additions, removals, and (via the explicit loops below) renames.
      - name: Verify active plugin count
        run: |
          set -euo pipefail
          count=$(ls -d plugins/*/ | wc -l)
          if [ "$count" -ne 13 ]; then
            echo "Expected 13 plugins, found $count"
            exit 1
          fi
          echo "Confirmed 13 active plugins"

      # Gate 2: regenerate every plugin from its canonical declarative source
      # (plugin.yml + skills-src) using the pinned Builder 0.0.9.
      # The Builder version is pinned so reproducibility is measured against
      # the exact release that produced the checked-in artifacts.
      - name: Regenerate all plugins
        run: |
          set -euo pipefail
          mkdir -p /tmp/regenerated
          for plugin in github agent-browser context7 firecrawl redis sentry supabase figma cloudflare notion docker kubernetes postgresql; do
            # Remove any stale output so the step is safe to re-run
            # (builder 0.0.9 refuses to overwrite a non-empty directory)
            rm -rf "/tmp/regenerated/$plugin"
            npx @hiai-gg/agent-plugins-builder@0.0.9 create \
              --config plugins/$plugin/plugin.yml \
              --output /tmp/regenerated/$plugin || { echo "Regeneration failed for $plugin"; exit 1; }
          done

      # Gate 3: the checked-in generated artifacts must be byte-identical to a
      # fresh regeneration. Diffs plugin.json, mcp.json (when present), and the
      # FULL content of every skills/*/SKILL.md — not just a file count. A
      # reverse pass catches stale checked-in skills no longer generated.
      - name: Verify generated content matches checked-in
        run: |
          set -euo pipefail
          for plugin in github agent-browser context7 firecrawl redis sentry supabase figma cloudflare notion docker kubernetes postgresql; do
            # Regeneration must have produced a complete plugin
            test -f "/tmp/regenerated/$plugin/plugin.json" || { echo "Regeneration produced no output for $plugin"; exit 1; }

            # Compare plugin.json
            diff -u "plugins/$plugin/plugin.json" "/tmp/regenerated/$plugin/plugin.json" || exit 1

            # Compare mcp.json if the regenerated plugin ships one
            if [ -f "/tmp/regenerated/$plugin/mcp.json" ]; then
              diff -u "plugins/$plugin/mcp.json" "/tmp/regenerated/$plugin/mcp.json" || exit 1
            fi

            # Compare ALL SKILL.md files (full content, not just count)
            for skill_md in /tmp/regenerated/$plugin/skills/*/SKILL.md; do
              skill_name=$(basename "$(dirname "$skill_md")")
              test -f "plugins/$plugin/skills/$skill_name/SKILL.md" || { echo "Missing checked-in skill: $plugin/$skill_name"; exit 1; }
              diff -u "plugins/$plugin/skills/$skill_name/SKILL.md" "$skill_md" || exit 1
            done

            # Catch stale checked-in skills that are no longer generated
            for skill_md in plugins/$plugin/skills/*/SKILL.md; do
              skill_name=$(basename "$(dirname "$skill_md")")
              test -f "/tmp/regenerated/$plugin/skills/$skill_name/SKILL.md" || { echo "Stale checked-in skill: $plugin/$skill_name"; exit 1; }
            done
          done
          echo "All 13 plugins match regenerated output (plugin.json, mcp.json, skills/)"

      # Gate 4 (mandatory): the ecosystem's canonical validator must pass on
      # every checked-in plugin. Doctor 0.0.6 is pinned; its exit code is
      # non-zero on spec errors (e.g. DOC-7003 duplicate frontmatter), so a
      # single failing plugin fails the whole job.
      - name: Doctor validation
        run: |
          fail=0
          for plugin in github agent-browser context7 firecrawl redis sentry supabase figma cloudflare notion docker kubernetes postgresql; do
            echo "Checking $plugin..."
            npx @hiai-gg/agent-plugins-doctor@0.0.6 check plugins/$plugin || fail=1
          done
          if [ $fail -ne 0 ]; then
            echo "Doctor validation failed"
            exit 1
          fi

      # Gate 5: no committed secret-like literals across generated content and
      # plugin sources (JSON, Markdown, YAML). "env.", "EXAMPLE" and
      # "placeholder" references are expected documentation, not secrets.
      - name: Secret scan
        run: |
          # Check for common secret patterns
          if grep -rEi "(password|secret|token|api_key)\s*[:=]\s*['\"][^'\"]{8,}" plugins/ --include="*.json" --include="*.md" --include="*.yml" | grep -v "env\.\|EXAMPLE\|placeholder"; then
            echo "Potential secrets found"
            exit 1
          fi
